        - {word: buriti, hint: "palmeira da vereda"}
        - {word: mandacaru, hint: "flor da caatinga"}
        - {word: jatobá, hint: "árvore de casca grossa e fruto doce"}
        - {word: aroeira, hint: "árvore de sombra e resina"}
        - {word: jenipapo, hint: "tinta azul-escura da fruta"}
        - {word: vitória-régia, hint: "folha que sustenta a água"}
        - {word: sempre-viva, hint: "flor que permanece"}
    - name: Ventos e tempo
      entries:
        - {word: minuano, hint: "vento frio do sul"}
        - {word: garoa, hint: "chuva miúda"}
        - {word: trovoada, hint: "céu que fala alto"}
        - {word: estiagem, hint: "terra à espera"}
