  avoid: [noite, lua, luar, sereno, sonho, místico, sagrado]
  groups:
    - name: Biomas e paisagens
      entries:
        - {word: cerrado, hint: "campo alto, ipê, seca luminosa"}
        - {word: caatinga, hint: "mandacaru, pedra quente, céu largo"}
        - {word: pantanal, hint: "água e terra no mesmo chão"}
        - {word: mata atlântica, hint: "sombra úmida, folha grande"}
        - {word: sertão, hint: "distância, poeira, firmeza"}
        - {word: vereda, hint: "buriti e água no cerrado"}
        - {word: chapada, hint: "serra de mesa, horizonte"}
        - {word: serra, hint: "subida, vento, pedra"}
        - {word: cachoeira, hint: "queda, espuma, voz da água"}
        - {word: igarapé, hint: "caminho d'água sob a mata"}
